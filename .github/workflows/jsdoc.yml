name: Deploy JSDoc to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # Allow only one concurrent deployment

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build-docs
      - name: Copy product site into artifact
        run: |
          cp docs/index.html docs/jsdoc/index.html
          cp docs/styles.css docs/jsdoc/styles.css
          cp docs/.nojekyll docs/jsdoc/.nojekyll
          cp -r docs/assets docs/jsdoc/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/jsdoc

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4