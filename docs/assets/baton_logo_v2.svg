<svg width="100%" viewBox="232 26 216 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Baton logo</title>
  <desc>Baton CLI issue tracker logo — a relay baton with a blue accent stripe above the wordmark "baton".</desc>
  <defs>
    <style>
      .logo-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- baton mark -->
  <g transform="translate(340, 90) rotate(-28) scale(0.82)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#2a2a2a"/>
    <rect x="-18" y="-14" width="36" height="28" fill="#4a90e2"/>
    <rect x="-128" y="-11" width="22" height="22" rx="11" fill="#555"/>
    <rect x="106" y="-11" width="22" height="22" rx="11" fill="#555"/>
    <rect x="-62" y="-6" width="8" height="12" rx="4" fill="#4a90e2"/>
    <rect x="54" y="-6" width="8" height="12" rx="4" fill="#4a90e2"/>
    <text x="-6" y="5" text-anchor="middle" class="logo-text" font-size="13" font-weight="500" letter-spacing="1" fill="#ffffff">&#8250;</text>
  </g>

  <!-- wordmark -->
  <text x="340" y="210" text-anchor="middle" class="logo-text" font-size="52" font-weight="500" letter-spacing="-1" fill="#e7e9ee">baton</text>
</svg>
